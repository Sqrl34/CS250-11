<!-- TITLE + DIVIDER -->
<div class="dashboard-header">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <h1>Dashboard</h1>
  <div class="divider"></div>
</div>

<!-- CENTERED SEARCH + FILTER -->
<div class="search-filter-bar">
  <!-- Search bar -->
  <input type="text" class="search-input" placeholder="Search..." [(ngModel)]="searchQuery" (input)="applyFilters()">
  <!-- Min Quantity Search --> 
  <input type="number" class="search-input" placeholder="Min Quantity" [(ngModel)]="minQuantity" (input)="applyFilters()" min="0">
  <!-- Max Quantity Search -->
  <input type="number" class="search-input" placeholder="Max Quantity" [(ngModel)]="maxQuantity" (input)="applyFilters()">
</div>

<!-- POSTS -->
<div class="dashboard-container">
  <div class="listing-card" *ngFor="let item of filteredListings">

    <div class="listing-image">
      <div class="image-placeholder"></div>
    </div>

    <!-- LEFT SIDE INFO -->
    <div class="listing-left">
      <h2 class="title">{{ item.title }}</h2>

      <div class="details">
        <span>{{ item.description }}</span>
        <span>Available until: {{ item.available_until }}</span>
        <span>Quantity: {{ item.quantity }}</span>
      </div>
    </div>

    <!-- CENTER DIVIDER -->
    <div class="vertical-divider"></div>

    <!-- RIGHT SIDE INFO -->
    <div class="listing-right">
      <div class="details">
        <span>Contact: {{ item.contact_info }}</span>
        <span>Location: {{ item.location }}</span>
      </div>
    </div>

    <button class="claim-button">→</button>

  </div>
</div>

<!-- BACK TO TOP BUTTON -->
<button class="back-to-top" (click)="scrollToTop()">↑</button>
