<div class="listing-page">
    <div class="listing-card">
        <h1>Create a produce listing</h1>
        <p class="subtitle">Share extra produce with people in your community.</p>
        <form (ngSubmit)="submitListing()">

            <label for="title">Produce Name</label>
            <div class="dropdown-wrapper">
                <input
                    id="title"
                    name="title"
                    type="text"
                    [(ngModel)]="searchText"
                    (input)="onSearchInput()"
                    (focus)="onFocusSearch()"
                    (blur)="onBlurSearch()"
                    placeholder="Search or select produce..."
                    autocomplete="off"
                    required
                />
                <div class="dropdown-list" *ngIf="showDropdown && filteredOptions.length > 0">
                    <div
                        class="dropdown-item"
                        *ngFor="let option of filteredOptions"
                        (mousedown)="selectProduce(option)"
                    >
                        {{ option }}
                    </div>
                </div>
            </div>

            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="number" min="1" [(ngModel)]="listingOfProduceOrFruit.quantOfProduce" placeholder="25" required/>

            <label for="description">Description</label>
            <textarea id="description" name="description" [(ngModel)]="listingOfProduceOrFruit.descrpt" rows="4" placeholder="Freshly ripened, in season, etc."></textarea>

            <label for="location">Pickup Location</label>
            <input id="location" name="location" type="text" [(ngModel)]="listingOfProduceOrFruit.house" placeholder="123 Main Street, Anytown, ST 12345" required/>

            <label for="availableUntil">Available Until</label>
            <input id="availableUntil" name="availableUntil" type="date" [(ngModel)]="listingOfProduceOrFruit.availUntil"/>

            <label for="contact_info">Contact Info</label>
            <input id="contact_info" name="contact_info" type="text" [(ngModel)]="listingOfProduceOrFruit.contactInfo" placeholder="Phone or Email"/>

            <button type="submit" [disabled]="submit">{{ submit ? 'Posting...' : 'Post Listing' }}</button>
        </form>
        <p class="message" *ngIf="message">{{ message }}</p>
    </div>
</div>
